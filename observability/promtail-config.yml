# Promtail leest de JSON-logs van Optimax (logs/dashboard.log) en ship ze naar Loki.
# De app logt al in JSON met o.a. level, logger en request_id -> direct labelbaar.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: optimax-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: optimax
          __path__: /var/log/optimax/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
      - labels:
          level:
          logger:

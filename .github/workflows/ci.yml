name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Dummy DB-config zodat de app kan starten (fail-fast vereist deze vars).
      # Zonder echte database vallen de DB-afhankelijke tests netjes weg (zie conftest).
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installeer dependencies
        run: npm ci
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

services:
  db:
    image: postgres:16-alpine
    # Alleen op loopback publiceren (SEC-11): de dashboard-container bereikt de DB via
    # het compose-netwerk; host-toegang (psql/Adminer) blijft werken via localhost,
    # maar de rest van het LAN kan niet meer rechtstreeks bij Postgres.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-db_dgs_01}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dgs_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dgs}"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  dashboard:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      # Default = de meegeleverde db-service. Zet DB_HOST/DB_PORT in .env om naar de
      # echte DGS-database te wijzen (dan is de db-service hieronder niet nodig).
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Resource-vangnet tegen geheugen-/proces-uitputting op het edge-device (SEC-27/SEC-12).
    # ~100-150MB is normaal voor deze app; 512MB geeft ruime piek-marge maar stopt een
    # runaway/geheugen-DoS ruim voordat het device-RAM vol loopt. no-new-privileges blokkeert
    # privilege-escalatie binnen de container.
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /api/health geeft 200 bij gezonde DB, 503 anders (urlopen gooit dan een fout).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  dgs_data:
